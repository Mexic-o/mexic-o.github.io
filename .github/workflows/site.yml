# Site Mexic Original : publication + news CS2 du jour, faites par GitHub tout seul.
# - deux fois par jour, vers 7 h et vers 23 h (heure de Paris) : collecte des news, mise à jour de news.json, publication du site ;
# - à chaque envoi de fichiers (« Upload files ») : publication du site (sans refaire les news) ;
# - à la main : onglet Actions > « Site Mexic Original » > Run workflow (news refaites tout de suite).
# Toujours sur la DERNIÈRE version du site (même en « Re-run ») : pas de vieux fichiers republiés, pas d'envoi refusé.
# Si une source de news est en panne, le site est quand même publié avec les news d'avant.
name: Site Mexic Original

on:
  schedule:
    - cron: "17 9 * * *"        # matin : 9 h 17 UTC = 10 h 17 à Paris l'hiver, 11 h 17 l'été
    - cron: "17 0 * * *"        # soir : 0 h 17 UTC = 1 h 17 à Paris l'hiver, 2 h 17 l'été (matchs de la soirée)
    - cron: "17 14 * * *"       # secours : 14 h 17 UTC = 15 h 17 à Paris l'hiver, 16 h 17 l'été (si un passage a sauté)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                # la dernière version, même quand on relance un ancien passage

      - uses: actions/setup-python@v6
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: News CS2 du jour
        id: news
        if: github.event_name != 'push'
        continue-on-error: true    # source en panne : on publie quand même le site avec les news d'avant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWSCS_WEBHOOK: ${{ secrets.NEWSCS_WEBHOOK }}
        run: |
          if [ -f outil/maj_news.py ]; then python outil/maj_news.py; else python maj_news.py; fi

      - name: Enregistrer les news dans le dépôt
        if: github.event_name != 'push' && steps.news.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A news.json outil/      # news + historique (+ outil/debug si une page n'a pas pu être lue)
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "News CS2 du $(date +%d/%m)"
          for essai in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Envoi refusé (souvent une erreur passagère de GitHub) : nouvel essai dans 30 s ($essai/5)"
            sleep 30
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Signaler une source en panne
        if: steps.news.outcome == 'failure'
        run: echo "::warning::News non mises à jour aujourd'hui (source en panne). Le site est publié avec les news d'avant ; nouvel essai demain."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deploiement
        uses: actions/deploy-pages@v4
